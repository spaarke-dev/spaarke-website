# The market access mail sync (projects/market-access, task 042).
#
# Every 30 minutes this asks the site to read new message metadata from the
# mailboxes registered at /admin/mailboxes and log mail with known contacts.
# The work happens in the site's own route, which already holds the Graph and
# storage settings; this workflow holds one shared secret, the same shape as
# daily-report.yml. GitHub's scheduler is best effort and can run late, which
# the sync's checkpoints absorb.

name: Mail sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a late run waits rather than overlapping the last one.
concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site to sync the mailboxes
        env:
          TOKEN: ${{ secrets.MA_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN}" ]; then
            echo "::error::MA_SYNC_TOKEN is not set in repository secrets."
            exit 1
          fi

          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            --max-time 90 \
            "https://spaarke.com/api/market/sync")

          # Counts only: the route never returns addresses or subjects.
          echo "HTTP ${code}"
          cat response.json || true
          echo ""

          if [ "${code}" != "200" ]; then
            echo "::error::The mail sync did not run. HTTP ${code}."
            exit 1
          fi

          # A mailbox that failed (for example, not in the Exchange scope yet)
          # shows its error on /admin/mailboxes; it does not fail the run.
          if ! grep -q '"failed":0' response.json; then
            echo "::warning::A mailbox failed to sync. See /admin/mailboxes."
          fi
