name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Two deploys in flight at once do not queue at the Azure end, they cancel each
# other: merging two pull requests a minute apart on 2026-09-27 produced
# "Deployment Failure Reason: Deployment Canceled" and left main built but not
# published. Queue them here instead, and do not cancel the one already running,
# because the one already running may be the one that matters.
concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # The article pages are statically generated, so whether the assistant
        # renders is decided here rather than at request time. The matching app
        # setting of the same name gates the endpoint at runtime, and the two do
        # different jobs: clear this one and the console disappears on the next
        # build; clear the app setting and every question is refused immediately,
        # which is the switch to reach for if spend runs away.
        env:
          INSIGHTS_ENABLED: "true"
          # The pages that render a captcha are statically generated, so the site
          # key has to be here and not only in the app settings. Without it the
          # widget never renders, the token is always empty, and the assistant
          # refuses every first question with a message telling the reader to
          # confirm something there is no way to confirm.
          #
          # A reCAPTCHA site key is public by design, since it appears in the page
          # it protects. It lives in a repository secret anyway, because this
          # repository is public and there is no reason to put it in a file.
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_0FB5BB10F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"
          # Strip Next's build cache and the SWC native binaries before SWA
          # packages the Functions zip. Otherwise Azure's 100 MB Functions
          # content limit (104,857,600 bytes) trips on apps with even a few
          # MB of /public/ assets — see Azure/static-web-apps#1034.
          api_build_command: 'rm -rf ./node_modules/@next/swc-* && rm -rf ./.next/cache'

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_0FB5BB10F }}
          action: "close"
