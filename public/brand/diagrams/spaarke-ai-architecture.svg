<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<defs>
  <!-- Spaarke AI box gradient: deep navy with subtle inner shimmer -->
  <linearGradient id="spaarkeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E2A47"/>
    <stop offset="50%" stop-color="#143864"/>
    <stop offset="100%" stop-color="#0E2A47"/>
  </linearGradient>

  <!-- Outer glow for Spaarke AI box -->
  <filter id="spaarkeGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="14" result="blur"/>
    <feFlood flood-color="#3B6FA8" flood-opacity="0.55"/>
    <feComposite in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Subtle inner highlight stroke -->
  <linearGradient id="spaarkeStroke" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
  </linearGradient>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E2A47"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
  </marker>

  <!-- AI Capabilities gradient: progression from generative to autonomous -->
  <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0a0a0a"/>
    <stop offset="50%"  stop-color="#141a2c"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </linearGradient>

  <!-- Sankey-style flow gradients: light slate → brand blue accent → dark navy (and reverse) -->
  <linearGradient id="flowIn" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#B8C9DD" stop-opacity="0.85"/>
    <stop offset="50%"  stop-color="#5078DC" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#0E2A47" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="flowOut" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0E2A47" stop-opacity="0.95"/>
    <stop offset="50%"  stop-color="#5078DC" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#B8C9DD" stop-opacity="0.85"/>
  </linearGradient>
</defs>
