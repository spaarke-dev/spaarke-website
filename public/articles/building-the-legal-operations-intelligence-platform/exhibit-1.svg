<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="ex-title ex-desc" font-family="system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="ex-title">Legal within the corporate structure</title>
  <desc id="ex-desc">A legal department inside the corporate structure, with strategic and tactical input flowing out to the board and the business units, requests and data flowing in, and the department's process, people, and technology shown inside the legal box.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8C2FF"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C63FF"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1238" height="658" rx="14" fill="#13132B" stroke="#2A2A52" stroke-width="2"/>
    <text x="620" y="44" text-anchor="middle" font-size="21" fill="#E8ECFF" font-weight="600">Legal sits inside the corporate structure and supplies strategic</text>
    <text x="620" y="70" text-anchor="middle" font-size="21" fill="#E8ECFF" font-weight="600">and tactical input to it.</text>
    <rect x="48" y="104" width="1144" height="506" rx="14" fill="none" stroke="#2A2A52" stroke-width="2"/>
    <text x="72" y="136" text-anchor="start" font-size="18" fill="#E8ECFF" font-weight="600">The company</text>
    <rect x="96" y="168" width="210" height="62" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="201" y="205" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Board</text>
    <rect x="96" y="250" width="210" height="62" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="201" y="287" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">CEO</text>
    <rect x="96" y="332" width="210" height="62" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="201" y="369" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Business units</text>
    <rect x="96" y="414" width="210" height="62" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="201" y="451" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Finance</text>
    <rect x="96" y="496" width="210" height="62" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="201" y="533" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">IT</text>
    <rect x="742" y="188" width="392" height="346" rx="11" fill="#3A3576" stroke="#7B5BFF" stroke-width="2.4"/>
    <text x="938" y="226" text-anchor="middle" font-size="20" fill="#E8ECFF" font-weight="600">Legal department</text>
    <rect x="776" y="256" width="324" height="60" rx="9" fill="#262450" stroke="#7B5BFF" stroke-width="1.8"/>
    <text x="938" y="292" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Process</text>
    <rect x="776" y="330" width="324" height="60" rx="9" fill="#262450" stroke="#7B5BFF" stroke-width="1.8"/>
    <text x="938" y="366" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">People</text>
    <rect x="776" y="404" width="324" height="60" rx="9" fill="#262450" stroke="#7B5BFF" stroke-width="1.8"/>
    <text x="938" y="440" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Technology</text>
    <text x="938" y="506" text-anchor="middle" font-size="16" fill="#A8B4D8" font-weight="400" font-style="italic">the platform, across all three</text>
    <text x="530" y="190" text-anchor="middle" font-size="17" fill="#E8ECFF" font-weight="500">Strategic input</text>
    <text x="530" y="212" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">risk appetite, market entry, M&amp;A,</text>
    <text x="530" y="232" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">regulatory posture, governance</text>
    <line x1="736" y1="250" x2="322" y2="250" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <text x="530" y="320" text-anchor="middle" font-size="17" fill="#E8ECFF" font-weight="500">Tactical input</text>
    <text x="530" y="342" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">contracts, disputes, employment questions,</text>
    <text x="530" y="362" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">the advice needed this week</text>
    <line x1="736" y1="380" x2="322" y2="380" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <text x="530" y="456" text-anchor="middle" font-size="17" fill="#E8ECFF" font-weight="500">Requests and data</text>
    <text x="530" y="478" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">what the business asks for, and what it reports</text>
    <line x1="322" y1="496" x2="736" y2="496" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
</svg>
