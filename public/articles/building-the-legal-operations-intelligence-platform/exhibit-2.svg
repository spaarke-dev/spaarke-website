<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" role="img" aria-labelledby="ex-title ex-desc" font-family="system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="ex-title">The decision loop</title>
  <desc id="ex-desc">An invoice exception moving through a queue to a decision, with the record written against the invoice, the matter, and the firm, the approved amount returned to the e-billing platform, and a report card accumulating over four quarters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8C2FF"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C63FF"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1238" height="578" rx="14" fill="#13132B" stroke="#2A2A52" stroke-width="2"/>
    <text x="620" y="44" text-anchor="middle" font-size="21" fill="#E8ECFF" font-weight="600">A decision taken inside the platform leaves a record</text>
    <text x="620" y="70" text-anchor="middle" font-size="21" fill="#E8ECFF" font-weight="600">that the department can learn from.</text>
    <rect x="48" y="170" width="250" height="96" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="173" y="212" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Exception flagged</text>
    <text x="173" y="236" text-anchor="middle" font-size="16" fill="#A8B4D8" font-weight="400">rate cap exceeded</text>
    <rect x="344" y="170" width="250" height="96" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="469" y="212" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Context attached</text>
    <text x="469" y="236" text-anchor="middle" font-size="16" fill="#A8B4D8" font-weight="400">terms, budget, history</text>
    <rect x="640" y="170" width="250" height="96" rx="9" fill="#3A3576" stroke="#7B5BFF" stroke-width="2.4"/>
    <text x="765" y="212" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Decision in the queue</text>
    <text x="765" y="236" text-anchor="middle" font-size="16" fill="#A8B4D8" font-weight="400">approve, reduce, return</text>
    <rect x="936" y="170" width="250" height="96" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="1061" y="212" text-anchor="middle" font-size="18" fill="#E8ECFF" font-weight="500">Recorded</text>
    <text x="1061" y="236" text-anchor="middle" font-size="16" fill="#A8B4D8" font-weight="400">invoice, matter, firm</text>
    <line x1="298" y1="218" x2="336" y2="218" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <line x1="594" y1="218" x2="632" y2="218" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <line x1="890" y1="218" x2="928" y2="218" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <path d="M 1061 266 L 1061 352" fill="none" stroke="#4C63FF" stroke-width="2.4" opacity="0.9" marker-end="url(#arrowHot)"/>
    <rect x="898" y="360" width="250" height="78" rx="9" fill="#262450" stroke="#4060DC" stroke-width="1.8"/>
    <text x="1023" y="393.1666666666667" text-anchor="middle" font-size="17" fill="#E8ECFF" font-weight="500">Written back</text>
    <text x="1023" y="416.1666666666667" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">to the e-billing platform</text>
    <path d="M 898 399 L 620 399" fill="none" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <rect x="376" y="360" width="244" height="78" rx="9" fill="#3A3576" stroke="#7B5BFF" stroke-width="2.4"/>
    <text x="498" y="393.1666666666667" text-anchor="middle" font-size="17" fill="#E8ECFF" font-weight="500">The firm's report card</text>
    <text x="498" y="416.1666666666667" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400">four quarters on</text>
    <path d="M 376 399 L 180 399 L 180 274" fill="none" stroke="#A8C2FF" stroke-width="1.7" opacity="0.9" marker-end="url(#arrow)"/>
    <text x="620" y="494" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400" font-style="italic">The record exists only because each decision was captured as data.</text>
    <text x="620" y="522" text-anchor="middle" font-size="15" fill="#A8B4D8" font-weight="400" font-style="italic">In a reporting environment the decision happens in email and leaves nothing behind.</text>
</svg>
