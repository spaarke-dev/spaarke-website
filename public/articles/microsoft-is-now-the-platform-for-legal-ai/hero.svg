<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A first step that connects to the platform above it</title>
  <desc id="hero-desc">A small coral module on the first of five rising teal planes, with fine pale green lines running from it into the planes above, on a deep teal background.</desc>
  <defs>
    <radialGradient id="canvas" cx="50%" cy="55%" r="82%">
      <stop offset="0%" stop-color="#0F3B3A"/>
      <stop offset="52%" stop-color="#0A2A2C"/>
      <stop offset="100%" stop-color="#06181B"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B8F7F"/>
      <stop offset="100%" stop-color="#1E6F66"/>
    </linearGradient>
    <linearGradient id="planeHigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FB59A"/>
      <stop offset="100%" stop-color="#2B8F7F"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A7E"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FE0B5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3FE0B5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="70%" stop-color="#06181B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06181B" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#canvas)"/>
  <ellipse cx="900" cy="430" rx="620" ry="320" fill="url(#glow)"/>

  <!-- Five rising planes, drawn back to front (isometric slabs) -->
  <!-- Plane 5 (highest, widest, darkest) -->
  <g opacity="0.92">
    <polygon points="980,200 1420,200 1520,260 1080,260" fill="#1E6F66" stroke="#2B8F7F" stroke-width="2"/>
    <polygon points="1080,260 1520,260 1520,284 1080,284" fill="#123F3C"/>
    <polygon points="980,200 1080,260 1080,284 980,224" fill="#0E3533"/>
  </g>
  <!-- Plane 4 -->
  <g>
    <polygon points="860,300 1260,300 1360,360 960,360" fill="url(#plane)" stroke="#2B8F7F" stroke-width="2"/>
    <polygon points="960,360 1360,360 1360,384 960,384" fill="#154A46"/>
    <polygon points="860,300 960,360 960,384 860,324" fill="#103C39"/>
  </g>
  <!-- Plane 3 -->
  <g>
    <polygon points="740,400 1100,400 1200,460 840,460" fill="url(#plane)" stroke="#3FB59A" stroke-width="2"/>
    <polygon points="840,460 1200,460 1200,484 840,484" fill="#175550"/>
    <polygon points="740,400 840,460 840,484 740,424" fill="#124541"/>
  </g>
  <!-- Plane 2 -->
  <g>
    <polygon points="620,500 940,500 1040,560 720,560" fill="url(#planeHigh)" stroke="#3FB59A" stroke-width="2"/>
    <polygon points="720,560 1040,560 1040,584 720,584" fill="#1A615A"/>
    <polygon points="620,500 720,560 720,584 620,524" fill="#144E49"/>
  </g>
  <!-- Plane 1 (lowest, lit in coral) -->
  <ellipse cx="560" cy="640" rx="300" ry="120" fill="url(#coralGlow)"/>
  <g>
    <polygon points="380,600 660,600 760,660 480,660" fill="#2B8F7F" stroke="#FF7A59" stroke-width="2.6"/>
    <polygon points="480,660 760,660 760,684 480,684" fill="#1A615A"/>
    <polygon points="380,600 480,660 480,684 380,624" fill="#144E49"/>
  </g>

  <!-- Fine lines from the module into the planes above -->
  <g fill="none" stroke="#B5F2DC" stroke-width="1.6" stroke-opacity="0.85">
    <path d="M 600 590 C 680 540, 760 520, 820 530"/>
    <path d="M 604 584 C 720 480, 860 430, 960 430"/>
    <path d="M 608 578 C 760 420, 960 340, 1100 330"/>
    <path d="M 612 572 C 800 360, 1060 250, 1240 230"/>
  </g>
  <g fill="#B5F2DC">
    <circle cx="820" cy="530" r="4"/>
    <circle cx="960" cy="430" r="4"/>
    <circle cx="1100" cy="330" r="4"/>
    <circle cx="1240" cy="230" r="4"/>
  </g>

  <!-- The coral module on the first plane -->
  <g>
    <polygon points="540,560 620,560 650,578 570,578" fill="url(#coral)"/>
    <polygon points="570,578 650,578 650,616 570,616" fill="#E5684A"/>
    <polygon points="540,560 570,578 570,616 540,598" fill="#C9553B"/>
    <polygon points="540,560 620,560 650,578 570,578" fill="none" stroke="#FFD2C4" stroke-width="1.4" stroke-opacity="0.8"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
