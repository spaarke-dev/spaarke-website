<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">The New Mandate for Legal Operations</title>
  <desc id="hero-desc">Three angled navy planes meeting at a single point on the left of a deep navy field, with one electric blue line running from that point to the right, suggesting three changes converging on one decision.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="82%">
      <stop offset="0%" stop-color="#34325E"/>
      <stop offset="52%" stop-color="#23224A"/>
      <stop offset="100%" stop-color="#161630"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B5BFF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#7B5BFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7B5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D3B72"/>
      <stop offset="100%" stop-color="#26244E"/>
    </linearGradient>
    <linearGradient id="planeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332E62"/>
      <stop offset="100%" stop-color="#26244E"/>
    </linearGradient>
    <linearGradient id="planeFocal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4D4890"/>
      <stop offset="100%" stop-color="#332E62"/>
    </linearGradient>
    <linearGradient id="planeFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4D4890"/>
      <stop offset="100%" stop-color="#3D3B72"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="520" cy="560" r="300" fill="url(#halo)"/>
    <polygon points="520,560 181.16,295.27 226.71,236.95 565.56,501.69" fill="url(#planeFlat)" stroke="#4060DC" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>
    <polygon points="520,560 107.27,516.62 115.43,439.05 528.15,482.43" fill="url(#plane)" stroke="#4060DC" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>
    <polygon points="520,560 172.85,768.59 135.76,706.87 482.92,498.28" fill="url(#planeFlat)" stroke="#4060DC" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>
    <line x1="520" y1="560" x2="1235" y2="560" stroke="#000BFF" stroke-width="2.4" opacity="0.92"/>
    <circle cx="1252" cy="560" r="11" fill="#000BFF"/>
    <polygon points="549.44,543 549.44,577 520,594 490.56,577 490.56,543 520,526" fill="#4D4890" stroke="#7B5BFF" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
