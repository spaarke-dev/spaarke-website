<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">From Spend Analytics to Legal Operations Intelligence</title>
  <desc id="hero-desc">Seven identical thin planes stacked in an even column on a deep rust-red field, the fourth lit brighter, with two fine lines leaving its right edge and ending in a small open circle and a small bright orange square, suggesting one governed metric read by a person and by an automated process.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="82%">
      <stop offset="0%" stop-color="#5E1A11"/>
      <stop offset="52%" stop-color="#340E09"/>
      <stop offset="100%" stop-color="#140503"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F58B5E" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#F58B5E" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F58B5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#933122"/>
      <stop offset="100%" stop-color="#4A1710"/>
    </linearGradient>
    <linearGradient id="planeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78271B"/>
      <stop offset="100%" stop-color="#4A1710"/>
    </linearGradient>
    <linearGradient id="planeFocal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B03E2C"/>
      <stop offset="100%" stop-color="#78271B"/>
    </linearGradient>
    <linearGradient id="planeFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B03E2C"/>
      <stop offset="100%" stop-color="#933122"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="500" cy="484" r="270" fill="url(#halo)"/>
    <polygon points="304,286 500,242 696,286 500,330" fill="url(#plane)" stroke="#DC5C3C" stroke-width="1.8" stroke-linejoin="round" opacity="0.96"/>
    <polygon points="304,352 500,308 696,352 500,396" fill="url(#plane)" stroke="#DC5C3C" stroke-width="1.8" stroke-linejoin="round" opacity="0.96"/>
    <polygon points="304,418 500,374 696,418 500,462" fill="url(#plane)" stroke="#DC5C3C" stroke-width="1.8" stroke-linejoin="round" opacity="0.96"/>
    <polygon points="304,484 500,440 696,484 500,528" fill="url(#planeFocal)" stroke="#F58B5E" stroke-width="2.4" stroke-linejoin="round" opacity="0.96"/>
    <polygon points="304,550 500,506 696,550 500,594" fill="url(#plane)" stroke="#DC5C3C" stroke-width="1.8" stroke-linejoin="round" opacity="0.96"/>
    <polygon points="304,616 500,572 696,616 500,660" fill="url(#plane)" stroke="#DC5C3C" stroke-width="1.8" stroke-linejoin="round" opacity="0.96"/>
    <polygon points="304,682 500,638 696,682 500,726" fill="url(#plane)" stroke="#DC5C3C" stroke-width="1.8" stroke-linejoin="round" opacity="0.96"/>
    <path d="M 696 484 L 900 484 L 1010 392" fill="none" stroke="#FCD0B2" stroke-width="1.8" opacity="0.88" stroke-linejoin="round"/>
    <path d="M 696 484 L 900 484 L 1010 594" fill="none" stroke="#FCD0B2" stroke-width="1.8" opacity="0.88" stroke-linejoin="round"/>
    <circle cx="1040" cy="382" r="20" fill="none" stroke="#FCD0B2" stroke-width="2.2"/>
