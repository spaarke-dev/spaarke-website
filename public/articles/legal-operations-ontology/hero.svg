  <title id="hero-title">The Legal Operations Intelligence Ontology</title>
  <desc id="hero-desc">A constellation of small geometric nodes joined by fine light blue lines on a deep navy field, three heavier hexagons at the center and a single electric blue edge reaching out to a lone node at the right, suggesting an ontology of connected legal entities.</desc>

