    <text x="620" y="44" text-anchor="middle" font-size="21" fill="#E8ECFF" font-weight="600">The relationships among a department's records are the asset,</text>
    <text x="620" y="70" text-anchor="middle" font-size="21" fill="#E8ECFF" font-weight="600">and most departments hold the records without them.</text>
